on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run lint
        run: |
           tox -e lint

  tests:
    strategy:
      fail-fast: false
      matrix:
        # Test the oldest and newest Python supported by the Django series
        # against every TiDB version; Python versions in between are only
        # tested against the latest TiDB (see `include`).
        python-version:
          - '3.12'
          - '3.14'
        django-version:
          - '6.0.10'
        # The latest patch release of each TiDB LTS series.
        # TiDB < 6.2.0 is not tested: it does not support savepoints, and
        # Django >= 4.2 (`debug_transaction`) makes all `assertNumQueries`
        # fail on such databases.
        # https://github.com/django/django/commit/798e38c2b9c46ab72e2ee8c33dc822f01b194b1e
        tidb-version:
          - 'v8.5.8'
          - 'v8.1.2'
          - 'v7.5.8'
          - 'v7.1.6'
          - 'v6.5.12'
        include:
          - python-version: '3.13'
            django-version: '6.0.10'
            tidb-version: 'v8.5.8'

    name: py${{ matrix.python-version }}_tidb${{ matrix.tidb-version }}_django${{ matrix.django-version }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions
          sudo apt-get update
          sudo apt-get install -y libmemcached-dev zlib1g-dev

      - name: Setup TiDB
        uses: ./.github/actions/setup-tidb
        with:
          tidb-version: ${{ matrix.tidb-version }}

      - name: Run tests
        run: tox
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}

  vector-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.14'
        django-version:
          - '6.0.10'

    name: vector-py${{ matrix.python-version }}_django${{ matrix.django-version }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox tox-gh-actions
          sudo apt-get update
          sudo apt-get install -y libmemcached-dev zlib1g-dev

      - name: Setup TiDB with TiFlash
        uses: ./.github/actions/setup-tidb
        with:
          tidb-version: v8.5.8
          tiflash: 1

      - name: Hack for vector tests
        run: |
          sed '27a cp -rT ./tests/tidb_vector $DJANGO_TESTS_DIR/django/tests/tidb_vector' -i django_test_suite.sh
          sed '31a pip install numpy~=2.0' -i django_test_suite.sh
          cat django_test_suite.sh
          echo -n "tidb_vector" > django_test_apps.txt
          cat django_test_apps.txt

      - name: Run tests
        run: tox
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
